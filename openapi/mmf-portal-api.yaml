openapi: 3.0.3
info:
  title: MM Factory Portal API
  description: >
    REST API for the Mid-Market Factory Portal covering prospects, campaigns,
    solutions & assets, triggers radar, Smart Agents, governance, KPIs and
    administration. Backed by Spring Boot 4 and PostgreSQL; resources map to
    the tables defined in database/schema.sql.
  version: "1.0.0"
servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Scope
  - name: Business Units
  - name: Roles & Permissions
  - name: Accounts
  - name: Prospects
  - name: Prospect Uploads
  - name: Solutions & Assets
  - name: Campaigns
  - name: Opportunities
  - name: Triggers Radar
  - name: Smart Agents
  - name: Governance
  - name: Dashboard & KPIs
  - name: Admin

paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a user and issue an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user, role and portal view
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- Scope
  /scope:
    get:
      tags: [Scope]
      summary: List business units and countries available for BU/country scoping
      responses:
        "200":
          description: Scope options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeOptions" }

  # ------------------------------------------------------- Business Units
  /business-units:
    get:
      tags: [Business Units]
      summary: List business units
      responses:
        "200":
          description: Business units
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusinessUnit" }

  /business-units/{code}:
    parameters:
      - $ref: "#/components/parameters/BusinessUnitCode"
    get:
      tags: [Business Units]
      summary: Get a business unit by code
      responses:
        "200":
          description: Business unit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessUnit" }
        "404": { $ref: "#/components/responses/NotFound" }

  /business-units/{code}/countries:
    parameters:
      - $ref: "#/components/parameters/BusinessUnitCode"
    get:
      tags: [Business Units]
      summary: List countries within a business unit
      responses:
        "200":
          description: Countries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Country" }

  # --------------------------------------------------- Roles/Permissions
  /portal-views:
    get:
      tags: [Roles & Permissions]
      summary: List portal views
      responses:
        "200":
          description: Portal views
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PortalView" }

  /roles:
    get:
      tags: [Roles & Permissions]
      summary: List roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }

  /roles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Roles & Permissions]
      summary: Get a role by name
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "404": { $ref: "#/components/responses/NotFound" }

  /roles/{name}/permissions:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Roles & Permissions]
      summary: Get module access levels for a role
      responses:
        "200":
          description: Role permissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RolePermission" }
    put:
      tags: [Roles & Permissions]
      summary: Replace module access levels for a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/RolePermission" }
      responses:
        "200":
          description: Updated permissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RolePermission" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /modules:
    get:
      tags: [Roles & Permissions]
      summary: List modules
      responses:
        "200":
          description: Modules
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  # -------------------------------------------------------------- Accounts
  /accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      parameters:
        - $ref: "#/components/parameters/BusinessUnitFilter"
        - $ref: "#/components/parameters/CountryFilter"
        - name: sector
          in: query
          schema: { type: string }
        - name: tier
          in: query
          schema: { type: integer, enum: [1, 2] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountPage" }
    post:
      tags: [Accounts]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /accounts/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Accounts]
      summary: Get an account by name
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Accounts]
      summary: Update an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Accounts]
      summary: Delete an account
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------- Prospects
  /prospects:
    get:
      tags: [Prospects]
      summary: List prospects
      parameters:
        - $ref: "#/components/parameters/BusinessUnitFilter"
        - $ref: "#/components/parameters/CountryFilter"
        - name: lifecycleStage
          in: query
          schema: { $ref: "#/components/schemas/LifecycleStage" }
        - name: owner
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged prospects
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProspectPage" }
    post:
      tags: [Prospects]
      summary: Create a prospect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProspectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Prospect" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /prospects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProspectId"
    get:
      tags: [Prospects]
      summary: Get a prospect by id
      responses:
        "200":
          description: Prospect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Prospect" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Prospects]
      summary: Update a prospect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProspectInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Prospect" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Prospects]
      summary: Delete a prospect
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /prospects/{id}/convert:
    parameters:
      - $ref: "#/components/parameters/ProspectId"
    post:
      tags: [Prospects]
      summary: Convert a qualified prospect into an opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProspectConversionInput" }
      responses:
        "201":
          description: Opportunity created from the prospect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /prospects/{id}/interactions:
    parameters:
      - $ref: "#/components/parameters/ProspectId"
    get:
      tags: [Prospects]
      summary: List interactions for a prospect
      responses:
        "200":
          description: Interactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Interaction" }
    post:
      tags: [Prospects]
      summary: Log an interaction for a prospect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InteractionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interaction" }
        "404": { $ref: "#/components/responses/NotFound" }

  /prospects/interactions/{interactionId}:
    parameters:
      - name: interactionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Prospects]
      summary: Update an interaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InteractionInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interaction" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Prospects]
      summary: Delete an interaction
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------ Prospect Uploads
  /prospect-uploads/batches:
    get:
      tags: [Prospect Uploads]
      summary: List prospect upload batches
      parameters:
        - $ref: "#/components/parameters/BusinessUnitFilter"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged upload batches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadBatchPage" }
    post:
      tags: [Prospect Uploads]
      summary: Upload a prospect batch file for validation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, businessUnitCode]
              properties:
                file: { type: string, format: binary }
                businessUnitCode: { type: string }
      responses:
        "202":
          description: Batch accepted for validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadBatch" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /prospect-uploads/batches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Prospect Uploads]
      summary: Get an upload batch by id
      responses:
        "200":
          description: Upload batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadBatch" }
        "404": { $ref: "#/components/responses/NotFound" }

  /prospect-uploads/batches/{id}/records:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Prospect Uploads]
      summary: List row-level validation results for an upload batch
      responses:
        "200":
          description: Upload records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UploadRecord" }

  /prospect-uploads/batches/{id}/commit:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Prospect Uploads]
      summary: Commit the accepted rows of a validated batch into prospects
      responses:
        "200":
          description: Batch committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadBatch" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ------------------------------------------------------- Solutions/Assets
  /solutions:
    get:
      tags: [Solutions & Assets]
      summary: List solutions
      parameters:
        - name: solutionClass
          in: query
          schema: { $ref: "#/components/schemas/SolutionClass" }
        - name: maturity
          in: query
          schema: { $ref: "#/components/schemas/Maturity" }
        - name: certificationStatus
          in: query
          schema: { $ref: "#/components/schemas/CertificationStatus" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged solutions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolutionPage" }
    post:
      tags: [Solutions & Assets]
      summary: Create a solution
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolutionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Solution" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /solutions/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Solutions & Assets]
      summary: Get a solution by name
      responses:
        "200":
          description: Solution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Solution" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Solutions & Assets]
      summary: Update a solution
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolutionInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Solution" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Solutions & Assets]
      summary: Delete a solution
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /solutions/{name}/certify:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Solutions & Assets]
      summary: Certify and publish a solution
      responses:
        "200":
          description: Certified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Solution" }
        "404": { $ref: "#/components/responses/NotFound" }

  /solutions/{name}/assets:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Solutions & Assets]
      summary: List assets belonging to a solution
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Asset" }
    post:
      tags: [Solutions & Assets]
      summary: Add an asset to a solution
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { $ref: "#/components/responses/NotFound" }

  /solutions/{name}/play-templates:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Solutions & Assets]
      summary: List play templates belonging to a solution
      responses:
        "200":
          description: Play templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlayTemplate" }
    post:
      tags: [Solutions & Assets]
      summary: Create a play template for a solution
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayTemplateInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayTemplate" }
        "404": { $ref: "#/components/responses/NotFound" }

  /assets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Solutions & Assets]
      summary: Get an asset by id
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Solutions & Assets]
      summary: Update an asset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Solutions & Assets]
      summary: Delete an asset
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------ Campaigns
  /campaigns:
    get:
      tags: [Campaigns]
      summary: List campaigns
      parameters:
        - $ref: "#/components/parameters/BusinessUnitFilter"
        - $ref: "#/components/parameters/CountryFilter"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CampaignStatus" }
        - name: solutionName
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged campaigns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignPage" }
    post:
      tags: [Campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /campaigns/playbook-parts:
    get:
      tags: [Campaigns]
      summary: List the standard campaign playbook parts
      responses:
        "200":
          description: Playbook parts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CampaignPlaybookPart" }

  /campaigns/{name}:
    parameters:
      - $ref: "#/components/parameters/CampaignName"
    get:
      tags: [Campaigns]
      summary: Get a campaign by name
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Campaigns]
      summary: Update a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Campaigns]
      summary: Delete a campaign
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{name}/status:
    parameters:
      - $ref: "#/components/parameters/CampaignName"
    patch:
      tags: [Campaigns]
      summary: Transition a campaign's status (records campaign history)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, changedBy]
              properties:
                status: { $ref: "#/components/schemas/CampaignStatus" }
                changedBy: { type: string }
                changeDescription: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /campaigns/{name}/target-accounts:
    parameters:
      - $ref: "#/components/parameters/CampaignName"
    get:
      tags: [Campaigns]
      summary: List uploaded target accounts for a campaign
      responses:
        "200":
          description: Target accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UploadedTargetAccount" }
    post:
      tags: [Campaigns]
      summary: Add a target account to a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadedTargetAccountInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedTargetAccount" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{name}/history:
    parameters:
      - $ref: "#/components/parameters/CampaignName"
    get:
      tags: [Campaigns]
      summary: List the change history of a campaign
      responses:
        "200":
          description: Campaign history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CampaignHistoryEntry" }

  # --------------------------------------------------------- Opportunities
  /opportunities:
    get:
      tags: [Opportunities]
      summary: List opportunities
      parameters:
        - $ref: "#/components/parameters/BusinessUnitFilter"
        - $ref: "#/components/parameters/CountryFilter"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OpportunityStatus" }
        - name: isMmFactory
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged opportunities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityPage" }
    post:
      tags: [Opportunities]
      summary: Create an opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpportunityInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /opportunities/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Opportunities]
      summary: Get an opportunity by id
      responses:
        "200":
          description: Opportunity
          content:
            application/json:
