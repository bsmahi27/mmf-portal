<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mid-Market Factory Portal — Prototype v3.0</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --ink:#12233f; --mut:#64748b; --line:#e4e8ef;
    --navy:#0b1f3a; --navy2:#13294b;
    --primary:#0070ad; --primary-d:#005b8f; --teal:#12abdb; --cyan:#2ec4f1;
    --amber:#e08b00; --red:#d1394b; --green:#2a9d5c; --violet:#6b5bd2; --chip:#eef2f7;
    --pink:#ff5a6e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  a{color:inherit;text-decoration:none}
  .app{display:flex;min-height:100vh}
  /* Sidebar */
  .side{width:238px;background:var(--navy);color:#c7d3e3;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:18px 18px 14px;border-bottom:1px solid #1c3357}
  .brand b{color:#fff;font-size:15px;display:block}
  .brand span{font-size:11px;color:#7c93b3}
  .nav{padding:10px 8px;flex:1;overflow:auto}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;margin:2px 0;color:#c7d3e3;font-size:13.5px;cursor:pointer}
  .nav a:hover{background:#16305a;color:#fff}
  .nav a.active{background:var(--primary);color:#fff}
  .nav .ico{width:18px;text-align:center;font-size:15px}
  .nav .sect{font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:12px 12px 4px;color:#5b74a0}
  .side .foot{padding:12px 16px;border-top:1px solid #1c3357;font-size:11px;color:#5b74a0}
  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:9px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .top h1{font-size:16px;margin:0;flex:1;min-width:150px}
  .sel{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
  select{font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .who{display:flex;align-items:center;gap:8px}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
  .asof{font-size:11px;color:var(--mut);background:#f1f5f9;border:1px solid var(--line);border-radius:6px;padding:4px 8px;white-space:nowrap}
  .wrap{padding:20px;max-width:1280px}
  .banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:8px 14px;border-radius:8px;font-size:12.5px;margin-bottom:16px}
  /* Generic */
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 12px;font-size:14px}
  h2.page{font-size:20px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 16px}
  .grid{display:grid;gap:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .lab{font-size:12px;color:var(--mut)}
  .kpi .val{font-size:24px;font-weight:700;margin:4px 0 2px}
  .kpi .meta{font-size:11.5px;color:var(--mut)}
  .up{color:var(--green)} .down{color:var(--red)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.8px;vertical-align:top}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600;white-space:nowrap}
  tr.clk{cursor:pointer} tr.clk:hover{background:#f6f9fc}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.8px;font-weight:600;white-space:nowrap}
  .b-blue{background:#e0f0fa;color:#005b8f}.b-teal{background:#d5f2fb;color:#0b7c9e}.b-amber{background:#fdf0d5;color:#8a5a00}
  .b-red{background:#fde5e8;color:#a81f30}.b-green{background:#d9f2e4;color:#1c7345}.b-gray{background:#eef2f7;color:#475569}
  .b-violet{background:#eae7fb;color:#4c3fb0}.b-pink{background:#ffe4e8;color:#b8283c}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--primary);background:var(--primary);color:#fff;font-size:12.5px;cursor:pointer;font-weight:500;font-family:inherit}
  .btn:hover{background:var(--primary-d)}
  .btn.ghost{background:#fff;color:var(--primary)}
  .btn.sm{padding:4px 9px;font-size:11.5px}
  .btn.gray{background:#fff;color:var(--mut);border-color:var(--line)}
  .btn.warn{background:#fff;color:var(--amber);border-color:#f2d59a}
  .bar{height:8px;background:#eef2f7;border-radius:5px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--primary);border-radius:5px}
  .chip{display:inline-block;background:var(--chip);border-radius:6px;padding:3px 9px;font-size:11.2px;color:#475569;margin:2px 4px 2px 0;cursor:default}
  .chip.on{background:var(--primary);color:#fff}
  .chip.clk{cursor:pointer}
  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}
  .kanban{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}
  .kanban5{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
  .kcol{background:#eef2f7;border-radius:10px;padding:9px;min-height:110px}
  .kcol h4{margin:0 0 8px;font-size:10px;text-transform:uppercase;color:var(--mut);letter-spacing:.03em;line-height:1.3}
  .kcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 9px;margin-bottom:7px;cursor:pointer;font-size:11.8px}
  .kcard:hover{border-color:var(--primary)}
  .kcard b{display:block;font-size:12.2px;margin-bottom:2px}
  .drawer-bg{position:fixed;inset:0;background:rgba(11,31,58,.45);display:none;z-index:20}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:560px;max-width:94vw;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.18);
    transform:translateX(100%);transition:transform .22s ease;z-index:21;overflow:auto}
  .drawer.open{transform:translateX(0)} .drawer-bg.open{display:block}
  .drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;display:flex;align-items:flex-start;gap:10px;z-index:2}
  .drawer .dh h3{margin:0;font-size:16px} .drawer .db{padding:16px 20px 60px}
  .x{margin-left:auto;cursor:pointer;color:var(--mut);font-size:22px;line-height:1}
  .muted{color:var(--mut)} .mt{margin-top:13px}.mb{margin-bottom:10px}.mt6{margin-top:6px}
  .flex{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
  .tabs button{background:none;border:none;padding:9px 12px;font:inherit;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.active{color:var(--primary);border-color:var(--primary);font-weight:600}
  .sig{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .sig .score{font-weight:700;font-size:16px}
  .dims{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:9px 0}
  .dim{background:#f6f9fc;border-radius:7px;padding:6px 8px}
  .dim .dl{font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
  .dim .dv{font-size:13px;font-weight:600}
  .agentcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;display:flex;flex-direction:column}
  .agentcard:hover{border-color:var(--primary);box-shadow:0 4px 14px rgba(0,112,173,.08)}
  .agentcard .ic{width:36px;height:36px;border-radius:10px;background:#e6f2f9;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:9px}
  textarea,input.t,select.t{width:100%;font:inherit;font-size:12.8px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;resize:vertical;background:#fff;color:var(--ink)}
  label.fl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);margin:11px 0 4px;font-weight:600}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .output{background:#f6f9fc;border:1px solid var(--line);border-radius:10px;padding:13px;font-size:12.8px;white-space:pre-wrap;line-height:1.5}
  .legend{font-size:11.2px;color:var(--mut)}
  /* Dashboard tiles */
  .dashgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;cursor:pointer;position:relative;transition:box-shadow .15s,transform .15s}
  .tile:hover{box-shadow:0 6px 20px rgba(11,31,58,.10);transform:translateY(-1px);border-color:#cfe0ee}
  .tile .th{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .tile .ti{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;flex-shrink:0}
  .tile .tt{font-size:14.5px;font-weight:700}
  .tile .drill{position:absolute;top:14px;right:15px;font-size:11px;color:var(--mut);opacity:0;transition:opacity .15s}
  .tile:hover .drill{opacity:1}
  .tile .big{font-size:30px;font-weight:700;line-height:1.1}
  .tile .lab{font-size:11.5px;color:var(--mut);line-height:1.3}
  .metricrow{display:flex;gap:0;align-items:stretch}
  .metricrow>div{flex:1;padding:0 14px;border-left:1px solid var(--line)}
  .metricrow>div:first-child{padding-left:0;border-left:none}
  .att{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11px;color:var(--mut)}
  .ring{width:58px;height:58px;flex-shrink:0}
  /* Triggers Radar v3 — three-column vertical layout */
  .radar3{display:grid;grid-template-columns:236px minmax(0,1fr) 340px;gap:13px;align-items:start}
  .catlist{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;position:sticky;top:64px}
  .catlist a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:12.6px;cursor:pointer;color:var(--ink)}
  .catlist a:hover{background:#f1f6fb}
  .catlist a.on{background:var(--primary);color:#fff}
  .catlist a .ct{margin-left:auto;font-size:10.5px;opacity:.8}
  .feed{display:flex;flex-direction:column;gap:10px}
  .scard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
  .scard:hover{border-color:#cfe0ee;border-left-color:var(--primary);box-shadow:0 4px 14px rgba(11,31,58,.07)}
  .scard.sel{border-color:var(--primary);border-left-color:var(--primary);background:#f9fcff}
  .scard .st{font-weight:600;font-size:13.4px;margin:5px 0 4px}
  .detail{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;position:sticky;top:64px;max-height:calc(100vh - 90px);overflow:auto}
  .detail h4{margin:14px 0 5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  .detail h4:first-of-type{margin-top:6px}
  .sbar{display:flex;align-items:center;gap:7px;margin:3px 0}
  .sbar span{font-size:11px;color:var(--mut);width:62px;flex-shrink:0}
  .sbar .bar{flex:1}
  .flow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
  .flow .fs{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .flow .fs b{display:block;font-size:11.5px;color:var(--primary);margin-bottom:4px}
  .lifecycle{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--mut)}
  .lifecycle b{background:#eef2f7;border-radius:6px;padding:4px 10px;color:var(--ink);font-weight:600}
  /* Agent launchpad */
  .agentcard .use{font-size:11.6px;color:var(--primary);background:#f0f7fb;border-radius:7px;padding:6px 8px;margin-bottom:9px}
  /* Campaign cards */
  .campgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:13px}
  .campcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
  .campcard:hover{border-color:var(--primary);box-shadow:0 6px 18px rgba(11,31,58,.09)}
  .campcard .hero{height:92px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;position:relative}
  .campcard .hero i{position:absolute;top:8px;left:10px;font-style:normal;font-size:11px;font-weight:700;background:rgba(255,255,255,.22);border-radius:5px;padding:2px 7px}
  .campcard .cb{padding:11px 13px;display:flex;flex-direction:column;flex:1}
  .campcard .cb b{font-size:13px;text-transform:uppercase;letter-spacing:.02em}
  .campcard .cb p{margin:5px 0 9px;font-size:11.8px;color:var(--mut);line-height:1.4;flex:1}
  .monthrail{display:flex;flex-direction:column;gap:5px;width:78px;flex-shrink:0}
  .monthrail button{font:inherit;font-size:11.5px;padding:6px 0;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .monthrail button.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  .m9{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
  @media (max-width:1250px){.radar3{grid-template-columns:210px minmax(0,1fr)}.detail{display:none}.m9{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:1100px){.dashgrid{grid-template-columns:repeat(6,1fr)}.kanban{grid-template-columns:repeat(4,1fr)}.dims{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

/* ---------------- Scope handling ---------------- */
let scope = {type:'country', code:'NL'};
function buildScopeSelect(){
  const s=document.getElementById('scope');
  s.innerHTML =
    '<optgroup label="Country">'+COUNTRIES.map(c=>`<option value="c:${c.code}">${c.name}</option>`).join('')+'</optgroup>'+
    '<optgroup label="BU roll-up">'+BUS.map(b=>`<option value="b:${b}">${b} (BU)</option>`).join('')+'</optgroup>'+
    '<optgroup label="SBU"><option value="s:NCE">NCE — all countries</option></optgroup>';
  s.value='c:NL';
  s.onchange=()=>{const[v,k]=s.value.split(':');scope={type:v==='c'?'country':v==='b'?'bu':'sbu',code:k};render();};
}
function scopeCountries(){
  if(scope.type==='country') return [scope.code];
  if(scope.type==='bu') return COUNTRIES.filter(c=>c.bu===scope.code).map(c=>c.code);
  return COUNTRIES.map(c=>c.code);
}
function scopeLabel(){
  if(scope.type==='country') return COUNTRIES.find(c=>c.code===scope.code).name;
  if(scope.type==='bu') return scope.code+' (BU roll-up)';
  return 'NCE — SBU roll-up';
}
function inScope(c){return scopeCountries().includes(c);}
function agg(){
  const cs=scopeCountries(); const keys=Object.keys(KPI.NL);
  const o={}; keys.forEach(k=>o[k]=cs.reduce((a,c)=>a+KPI[c][k],0));
  ['coverage','reuse','tCoverage'].forEach(k=>o[k]=Math.round(cs.reduce((a,c)=>a+KPI[c][k],0)/cs.length));
  o.agents=uniqueAgents().length; // one shared launchpad across NCE
  return o;
}

function enrichCampaign(c){
  const [dd,mon,yr]=c.launch.split(' ');
  c.month=MONTHS.indexOf(mon); c.year=+yr; c.weeks=parseInt(c.dur)||12;
  const st=new Date(+yr,c.month,+dd), en=new Date(st.getTime()+c.weeks*7*864e5);
  c.startD=c.launch;
  c.endD=`${String(en.getDate()).padStart(2,'0')} ${MONTHS[en.getMonth()]} ${en.getFullYear()}`;
  c.ind=CAMP_INDUSTRY[c.theme]||c.ind||'Cross-industry';
}

/* ---- Asset lifecycle enrichment v3.1 (15 Sept 2026): refresh & maintenance ---- */
const ASSET_LIFECYCLE=['Draft','Submitted','Certified','In refresh','Re-certified','Retired'];
const ASSET_OWNERS=['S. de Vries','K. Weber','R. Patel','A. Lindqvist','M. Jansen','T. Schmidt'];
const REVIEW_MONTHS={'Battle card':6,'Template':12,'Deck':9,'Blueprint':12,'Sales kit':9,'Case study':18,'RFP response':12};
ASSETS.forEach((a,i)=>{
  a.owner=a.owner||ASSET_OWNERS[i%ASSET_OWNERS.length];
  a.cycle=a.cycle||(REVIEW_MONTHS[a.type]||12);
  const last=new Date(2026,(i*2)%12,10);
  a.lastReview=`${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][last.getMonth()]} ${last.getFullYear()}`;
  const nx=new Date(last.getFullYear(),last.getMonth()+a.cycle,10);
  a.nextReview=`${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][nx.getMonth()]} ${nx.getFullYear()}`;
  a.due=nx<=new Date(2026,11,31);
  a.state=a.cert==='Certified'?(a.due?'In refresh':'Certified'):a.cert;
  a.src=a.src||'Repository link';
});
function assetHealth(){
  const due=ASSETS.filter(a=>a.due).length, cert=ASSETS.filter(a=>a.cert==='Certified').length;
  return {due,cert,total:ASSETS.length};
}

function saveAsset(mode){

  const p=mode==='upload'?'ua_':'al_';

  if(!n){alert('Asset name is mandatory.');return;}
  ASSETS.unshift({n:n,bl:g(p+'bl'),th:g(p+'th'),type:g(p+'type'),repo:mode==='upload'?'SharePoint':g('al_repo'),
    ver:g(p+'ver')||'v1',cert:'Submitted',reuse:0,owner:g(p+'owner')||'Unassigned',cycle:+g(p+'cycle')||12,

    <button class="btn sm" onclick="registerAgent()">+ Register an external agent</button>
  </div>
  ${AGENT_STAGES.filter(st=>agentFilter.stage==='All'||agentFilter.stage===st.k).map(st=>{
    const list=AGENTS.filter(a=>a.st===st.k)
      .filter(a=>agentFilter.team==='All'||a.own===agentFilter.team)
      .filter(a=>!agentFilter.q||(a.n+' '+a.d+' '+a.u).toLowerCase().includes(agentFilter.q.toLowerCase()));
    if(!list.length) return '';
    return `<h3 style="margin:20px 0 3px;font-size:14.5px">${st.ic} ${st.k} <span class="legend" style="font-weight:400">\u00b7 ${list.length} agent${list.length>1?'s':''}</span></h3>
    <p class="legend" style="margin:0 0 10px">${st.sub}</p>
    <div class="cols">${list.map(a=>`<div class="agentcard">
      <div class="flex between mb"><span class="badge b-violet">${a.own}</span><span class="legend">${a.registered?'<span class="badge b-teal">Registered</span> ':''}${a.launches} launches</span></div>
      <b>${a.n}</b>
      <div style="font-size:12.2px;color:var(--mut);margin:6px 0 9px">${a.d}</div>
      <div class="use">Best used for: ${a.u}</div>
      <div class="flex between" style="margin-top:auto">
      <span class="legend">${signalsFor(a.n)?signalsFor(a.n)+' live signal'+(signalsFor(a.n)>1?'s':''):'\u00a0'}</span>
      <button class="btn sm" onclick="launchAgent('${a.n.replace(/'/g,"\\'")}','${a.own}')">Launch \u2197</button></div></div>`).join('')}</div>`;
  }).join('')}
  <div class="card mt"><b>Agent utilization on the dashboard</b>
  <div class="legend mt6">Usage is hard to measure while agents launch externally. MVP approximates it from launch clicks in the portal and labels it as an approximation. Open action (spec 7.3): confirm whether to keep the approximation or show agent count only \u2014 owner Vikas Rajak.</div></div>`;
};
/* ---- Register an external agent v3.1 (15 Sept 2026) ---- */
function registerAgent(){
  drawer('Register an external agent','<span class="badge b-violet">New agent</span> <span class="muted">Adds the agent to the launchpad</span>',`
  <div class="card mb" style="background:#f7f9fb"><b style="font-size:12.5px">\u2139\uFE0F The portal links, it does not host</b>
  <div class="legend mt6">Registering an agent adds it to the curated launchpad and makes it selectable as a recommended agent for radar trigger categories. The agent continues to run in Copilot / TLC \u2014 the portal stores the name, purpose, owning team and the launch link.</div></div>
  <div class="f2">
    <div><label class="fl">Agent name *</label><input class="t" id="ra_n" placeholder="e.g. Intelio"></div>
    <div><label class="fl">Owning team *</label><select class="t" id="ra_own">${AGENT_TEAMS.map(t=>`<option>${t}</option>`).join('')}<option>Other \u2014 specify in purpose</option></select></div>
    <div><label class="fl">Sales lifecycle stage *</label><select class="t" id="ra_st">${AGENT_STAGES.map(x=>`<option>${x.k}</option>`).join('')}</select></div>
    <div><label class="fl">Platform *</label><select class="t" id="ra_plat">${['Microsoft Copilot','TLC','Copilot Studio','External / partner hosted'].map(x=>`<option>${x}</option>`).join('')}</select></div>
  </div>
  <label class="fl mt">Co-pilot / agent link *</label>
  <input class="t" id="ra_url" placeholder="https://copilot.microsoft.com/\u2026 or the TLC agent URL">
  <div class="mt6"><button class="btn sm ghost" onclick="alert('Prototype \u2014 would confirm the link resolves and that the current user is licensed for this agent.')">Test link &amp; access</button></div>
  <label class="fl mt">What the agent does *</label><textarea class="t" id="ra_d" rows="3" placeholder="One or two sentences describing the agent output"></textarea>
  <label class="fl mt">Best used for *</label><textarea class="t" id="ra_u" rows="2" placeholder="When a seller should reach for this agent"></textarea>
  <div class="f2 mt">
    <div><label class="fl">Recommend for trigger categories</label>
      <div>${TRIGGER_CATS.map(t=>`<span class="chip clk" onclick="this.classList.toggle('on')">${t.ic} ${t.k}</span>`).join('')}</div></div>
    <div><label class="fl">Visibility</label><select class="t" id="ra_vis"><option>NCE \u2014 all countries</option>${BUS.map(b=>`<option>${b} (BU)</option>`).join('')}${COUNTRIES.map(c=>`<option>${c.name}</option>`).join('')}</select>
      <div class="legend mt6">Restrict where the agent appears if it is language- or market-specific.</div></div>
  </div>
  <div class="mt"><button class="btn" onclick="saveAgent()">Register agent</button>
  <button class="btn gray" onclick="closeDrawer()">Cancel</button></div>
  <div class="legend mt">Registered agents are reviewed by the Factory Agentic Lead before they appear to all sellers. Phase 2 (spec 08): register the agent's endpoint and schema so it can be invoked in-portal with RLS-scoped context.</div>`);
}
function saveAgent(){
  const g=x=>{const e=document.getElementById(x);return e?e.value.trim():'';};
  const n=g('ra_n'), url=g('ra_url');
  if(!n){alert('Agent name is mandatory.');return;}
  if(!url){alert('A co-pilot / agent link is mandatory \u2014 the launchpad needs somewhere to send the seller.');return;}
  AGENTS.push({n:n,st:g('ra_st'),own:g('ra_own'),d:g('ra_d')||'Externally registered agent.',u:g('ra_u')||'\u2014',launches:0,url:url,plat:g('ra_plat'),registered:true});
  closeDrawer(); render();
}
function uniqueAgents(){return [...new Set(AGENTS.map(a=>a.n))];}
function signalsFor(name){return SIGNALS.filter(s=>inScope(s.c)&&s.agents.includes(name)).length;}
function launchAgent(n,own){
  const sigs=SIGNALS.filter(s=>inScope(s.c)&&s.agents.includes(n));
  drawer(n,`<span class="badge b-violet">${own}</span> <span class="muted">Smart Agent</span>`,`
  <p>Opening <b>${n}</b>\u2026</p>
  <div class="output">In the live portal this button opens the agent in a new tab, carrying the account, signal or opportunity identifier where the agent supports it.

The agent runs in Copilot / TLC. Its output stays there \u2014 the portal does not capture it in MVP.</div>
  <div class="mt"><span class="badge b-amber">AI-generated \u2014 review before client-facing use</span></div>
  ${sigs.length?`<h3 class="mt">Live radar signals recommending this agent (${sigs.length})</h3>
  <table><thead><tr><th>Account</th><th>Category</th><th>Relevance</th></tr></thead><tbody>
  ${sigs.map(s=>`<tr class="clk" onclick="closeDrawer();go('radar');setTimeout(()=>selectSignal('${s.id}'),60)"><td>${s.acct}</td><td class="muted">${s.cat}</td><td><span class="badge ${RELCLS[s.rel]}">${s.rel}</span></td></tr>`).join('')}
  </tbody></table>`:''}
  <div class="legend mt">Phase 2 (spec 08): register the agent's endpoint and schema so it can be invoked in-portal with RLS-scoped context, and its output saved to the account, opportunity or campaign.</div>`);
}

/* =========================== SELLER INPUT =========================== */
function openSellerInput(prefill){
  const camps=CAMPAIGNS.filter(c=>inScope(c.c)&&['Active','Approved'].includes(c.status));
  const names=[...new Set([...PROSPECTS.filter(p=>inScope(p.c)).map(p=>p.n),...ACCOUNTS.filter(a=>inScope(a.c)).map(a=>a.n)])];
  drawer('Log an interaction','<span class="badge b-blue">Seller Input</span> <span class="muted">One screen · feeds every module</span>',`
  <p class="muted" style="font-size:12.5px;margin-top:0">Spec 13. Capture it once here and the prospect stage, engagement log, campaign metrics and dashboard all update. Nothing is re-entered anywhere else.</p>

  <label class="fl">① Campaign <span style="text-transform:none;font-weight:400">(optional — leave blank if not campaign-driven)</span></label>
  <select class="t"><option>— none —</option>${camps.map(c=>`<option>${c.n}</option>`).join('')}</select>

  <label class="fl">② Customer / prospect</label>
  <select class="t" id="siacct">${names.map(n=>`<option ${n===prefill?'selected':''}>${n}</option>`).join('')}<option>＋ Create new prospect…</option></select>
  <div class="legend mt6">Not found? Creating inline mints a Prospect ID and drops the record into <b>Target / Identified</b>.</div>

  <label class="fl">③ Interaction</label>
  <div class="f2">
    <div><select class="t"><option>Meeting delivered</option><option>Meeting scheduled</option><option>Outreach</option><option>Event</option><option>Webinar</option><option>Inbound</option></select></div>
    <div><input class="t" value="10 Aug 2026"></div>
  </div>
  <div class="f2">
    <div><label class="fl">Attendees</label><input class="t" placeholder="e.g. CIO, Head of Applications"></div>
    <div><label class="fl">CXO level?</label><select class="t"><option>Yes</option><option selected>No</option></select></div>
  </div>
  <label class="fl">Note</label>
  <textarea class="t" rows="2" placeholder="What happened, in one or two lines"></textarea>

  <label class="fl">④ Next step</label>
  <div class="f2">
    <div><input class="t" placeholder="e.g. Send value case and book workshop"></div>
    <div><input class="t" placeholder="Due date"></div>
  </div>

  <label class="fl">⑤ Resulting status</label>
  <select class="t" id="sistage">${PSTAGES.slice(0,6).map((s,i)=>`<option ${i===4?'selected':''}>${s}</option>`).join('')}</select>

  <div class="mt"><button class="btn" onclick="submitSellerInput()">Submit</button>
  <button class="btn gray" onclick="closeDrawer()">Cancel</button></div>
  <div id="siout"></div>`);
}
function submitSellerInput(){
  const acct=document.getElementById('siacct').value, st=document.getElementById('sistage').value;
  const out=document.getElementById('siout');
  out.innerHTML=`<div class="mt"><div class="output"><b>Submitted — propagated in one action</b>

✓ Prospect / account   ${acct} → stage <b>${st}</b> (stage history updated)
✓ Engagement log       interaction recorded → feeds meetings booked / delivered
✓ Campaign metrics     accounts engaged, meetings, CXO reach, qualified leads
✓ Dashboard            meetings generated, targeted / active accounts
${st==='Qualified Lead'?'\n→ Qualified Lead: prompt to create a Thor Sales Stage 2 opportunity.':''}</div>
  <div class="legend mt">No other screen will ask for any of this again (spec 13 §2).</div></div>`;
}

/* ---------------- Drawer ---------------- */
function drawer(title,subtitle,html){
  document.getElementById('drawer').innerHTML=
    `<div class="dh"><div><h3>${title}</h3><div style="margin-top:4px">${subtitle}</div></div><div class="x" onclick="closeDrawer()">×</div></div><div class="db">${html}</div>`;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('dbg').classList.add('open');
  document.getElementById('drawer').scrollTop=0;
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('dbg').classList.remove('open');}

/* ---------------- init ---------------- */
document.getElementById('role').onchange=()=>{
  const r=document.getElementById('role').value;
  document.getElementById('ava').textContent=r.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
};
buildScopeSelect();
buildNav();
render();
</script>
