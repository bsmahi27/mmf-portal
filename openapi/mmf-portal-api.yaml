components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    BusinessUnitFilter:
      name: businessUnitCode
      in: query
      schema: { type: string }
    CountryFilter:
      name: countryName
      in: query
      schema: { type: string }
    BusinessUnitCode:
      name: code
      in: path
      required: true
      schema: { type: string }
    ProspectId:
      name: id
      in: path
      required: true
      schema: { type: string }
    CampaignName:
      name: name
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: The request was invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ApiError:
      type: object
      properties:
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        timestamp: { type: string, format: date-time }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer }

    CurrentUser:
      type: object
      properties:
        username: { type: string }
        displayName: { type: string }
        roleName: { type: string }
        portalView: { type: string }
        businessUnitCode: { type: string }
        countryName: { type: string, nullable: true }

    ScopeOptions:
      type: object
      properties:
        businessUnits:
          type: array
          items: { $ref: "#/components/schemas/BusinessUnit" }

    BusinessUnit:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        hasCountries: { type: boolean }

    Country:
      type: object
      properties:
        name: { type: string }
        businessUnitCode: { type: string }

    PortalView:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        navigation:
          type: array
          items: { type: string }

    Role:
      type: object
      properties:
        name: { type: string }
        rightsDescription: { type: string }
        portalViewName: { type: string }

    AccessLevel:
      type: string
      enum: [NONE, R, RW, RW_CERTIFY]

    RolePermission:
      type: object
      properties:
        roleName: { type: string }
        moduleName: { type: string }
        accessLevel: { $ref: "#/components/schemas/AccessLevel" }

    Account:
      type: object
      properties:
        name: { type: string }
        businessUnitCode: { type: string }
        countryName: { type: string, nullable: true }
        sector: { type: string }
        tier: { type: integer, enum: [1, 2] }
        ownerName: { type: string }
        source: { type: string }
    AccountInput:
      allOf:
        - $ref: "#/components/schemas/Account"
    AccountPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/Account" }

    LifecycleStage:
      type: string
      enum:
        - Target Identified
        - Research
        - Outreach
        - Meetings Scheduled / Delivered
        - Qualified Lead
        - Converted to Opportunity

    ProspectSource:
      type: string
      enum: [Single form, Excel upload, Radar signal, Campaign]

    Prospect:
      type: object
      properties:
        id: { type: string }
        accountName: { type: string }
        businessUnitCode: { type: string }
        countryName: { type: string, nullable: true }
        industry: { type: string }
        estimatedTcvMillions: { type: number, format: double }
        lifecycleStage: { $ref: "#/components/schemas/LifecycleStage" }
        ownerName: { type: string }
        expectedSigningQuarter: { type: string, example: Q1-2027 }
        source: { $ref: "#/components/schemas/ProspectSource" }
        uploadBatchId: { type: string, nullable: true }
        qualificationStatus: { type: string }
    ProspectInput:
      allOf:
        - $ref: "#/components/schemas/Prospect"
    ProspectPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/Prospect" }

    ProspectConversionInput:
      type: object
      required: [name, valueMillions, stage, ownerName, closeDate]
      properties:
        name: { type: string }
        valueMillions: { type: number, format: double }
        stage: { type: string }
        ownerName: { type: string }
        closeDate: { type: string, format: date }
        solutionName: { type: string, nullable: true }
        probabilityPercent: { type: integer, minimum: 0, maximum: 100 }

    InteractionType:
      type: string
      enum: [Outreach, Call, Meeting scheduled, Meeting delivered]
    InteractionStatus:
      type: string
      enum: [Open, Closed]

    Interaction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        prospectId: { type: string }
        interactionType: { $ref: "#/components/schemas/InteractionType" }
        interactionDate: { type: string, format: date }
        sellerName: { type: string }
        notes: { type: string }
        nextAction: { type: string }
        status: { $ref: "#/components/schemas/InteractionStatus" }
